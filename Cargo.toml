[package]
name = "florus"
version = "0.1.0"
edition = "2021"
authors = ["FLORIS Rust Translation"]
description = "Rust implementation of FLORIS - A controls-oriented wind farm wake modeling software"
license = "BSD-3-Clause"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.10"
nalgebra = "0.33"
approx = "0.5"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
argmin = "0.11"
argmin-math = { version = "0.5", features = ["nalgebra_latest"] }
ordered-float = "5.1.0"

[dev-dependencies]
criterion = "0.5"

# Examples - Core (matching Python examples/ directory)
[[example]]
name = "001_opening_floris"
path = "examples/001_opening_floris.rs"

[[example]]
name = "002_farm_layout"
path = "examples/002_farm_layout.rs"

[[example]]
