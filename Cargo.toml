[package]
name = "florus"
version = "0.1.0"
edition = "2021"
authors = ["FLORIS Rust Translation"]
description = "Rust implementation of FLORIS - A controls-oriented wind farm wake modeling software"
license = "BSD-3-Clause"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_yaml = "0.9.33"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.10"
nalgebra = "0.33"
approx = "0.5"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
argmin = "0.11"
argmin-math = { version = "0.5", features = ["nalgebra_latest"] }
ordered-float = "5.1.0"
csv = "1.4.0"
log = "0.4"
env_logger = "0.11"
zip = "2.2"
derive_builder = "0.20.2"

[dev-dependencies]
criterion = "0.5"
